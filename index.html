<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Giphy Party</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main>
      <h1>Giphy Party</h1>  
      <div>

        <form type="submit" id="gifs-form">
          <label for="gif-search">Search for a GIF</label>
          <input type="text" id="gif-search" placeholder="search for gifs">
          <div class="buttons-cont">
            <button id="search-btn" type="button">Search</button>
            <button id="remove-btn" type="button">Remove</button>
          </div>
        </form>

      </div>
      <div id="imgs-div">
        <!-- Think about displaying the results here -->
        <!-- Or you can build out your own custom HTML structure -->
      </div>
     
    </main>
    <!-- Axios is already imported here for your convenience -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="config.js"></script>
    <script src="index.js"></script>
  </body>
</html>
